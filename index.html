  <link rel="stylesheet" href="css/styles.css?v=20260902a"/>
  <link rel="stylesheet" href="css/titan-slate-login.css"/>

  <!-- v2 design layer, loaded AFTER styles.css so the --v2-* tokens are
       available to the component sheets below.

       v2-staging-reset.css is the one sheet that must never be linked here. It
       carries the global rules (*, body) the standalone v2/*.html pages need
       because they own their document, and in this app they would repaint
       everything from #10131a to #00050d and break the .light theme.

       v2-shell.css used to be excluded for that reason too, since it carried
       those globals itself. It no longer does — they moved to the staging
       reset and the shell's own equivalents are scoped under .v2-app — so it
       is linked here for .v2-page-head and the rest of the shell layer. The
       sidebar and topbar rules in it stay inert until some page emits .v2-app
       markup, which none does yet: measured at 0 of 2128 computed properties
       changed on the ported Drivers page with real data.

       Every selector in these is .v2- prefixed or .v2-app scoped, and every
       custom property is --v2-, so nothing collides with the production
       stylesheet above. v2-skin.css is the exception that proves it: it
       deliberately remaps production's own tokens, scoped :root:not(.light).
       Pages are ported one at a time; add a component sheet as its page lands. -->
  <link rel="stylesheet" href="v2/css/v2-tokens.css"/>
  <link rel="stylesheet" href="v2/css/v2-shell.css"/>
  <link rel="stylesheet" href="v2/css/v2-skin.css"/>
  <link rel="stylesheet" href="v2/css/v2-bridge.css"/>
  <link rel="stylesheet" href="v2/css/v2-dash.css"/>
  <link rel="stylesheet" href="v2/css/v2-vehicles.css"/>
  <link rel="stylesheet" href="v2/css/v2-inspections.css"/>
  <link rel="stylesheet" href="v2/css/v2-drivers.css"/>
  <link rel="stylesheet" href="v2/css/v2-filter.css"/>
  <link rel="stylesheet" href="v2/css/v2-dispatch.css"/>
  <link rel="stylesheet" href="v2/css/v2-reports.css"/>
  <link rel="stylesheet" href="v2/css/v2-calendar.css"/>
  <link rel="stylesheet" href="v2/css/v2-reminders.css"/>
</head>
<body>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner" style="border-color:var(--primary);border-top-color:transparent;"></div>
  Loading FleetGuard...
</div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img class="brand-mark" src="img/fleetguard-icon.png?v=1" alt="FleetGuard logo"/>
      <h1>FleetGuard</h1>
      <p>Safety &amp; Compliance Platform</p>
      <div class="ts-headline">
        Every route.<br>
        Every driver.<br>
        <span>Under control.</span>
      </div>
      <div class="ts-status">
        <div class="ts-stat">
          <span class="ts-stat-lbl">System</span>
          <span class="ts-stat-val"><span class="ts-live-dot"></span>All nodes live</span>
        </div>
        <div class="ts-stat">
          <span class="ts-stat-lbl">Security</span>
          <span class="ts-stat-val ts-white">AES-256</span>
        </div>
      </div>
    </div>
    <div id="login-form-section">
      <div class="ts-form-heading">
        <div class="ts-form-title">Welcome back</div>
        <p class="ts-form-sub">Sign in to your fleet dashboard</p>
      </div>
      <div id="login-error" class="login-error"></div>
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')signIn()"/>
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" onkeydown="if(event.key==='Enter')signIn()"/>
      </div>
      <button id="login-btn" class="btn btn-primary login-btn-full" onclick="signIn()">Sign In</button>
    </div>
  </div>
</div>

  <div id="sidebar" class="v2-sidebar">
    <a class="v2-brand" href="#" onclick="navigate('dashboard');closeNav();return false">
      <img class="brand-mark" src="img/fleetguard-icon.png?v=1" alt="FleetGuard logo"/>
      FleetGuard

    <nav class="v2-nav" aria-label="Main">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M15.5 5H9a3.5 3.5 0 0 0 0 7h6a3.5 3.5 0 0 1 0 7H8.5"/></svg>
        Dispatch Board

      <button class="nav-item v2-nav-item" onclick="navigate('dashboard')" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-item v2-nav-item" onclick="navigate('vehicles')" id="nav-vehicles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h4V5H2v12h3"/><path d="M14 9h4l3 3v5h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
        Vehicles
      </button>
      <button class="nav-item v2-nav-item" onclick="navigate('drivers')" id="nav-drivers">

      <button class="nav-item v2-nav-item" onclick="navigate('calendar')" id="nav-calendar">

      <button class="nav-item v2-nav-item" onclick="navigate('inspections')" id="nav-inspections">

        Guides
      </a>
      <button class="nav-item v2-nav-item" onclick="navigate('portal')" id="nav-portal" style="display:none">

      <button class="nav-item v2-nav-item" onclick="navigate('reminders')" id="nav-reminders" style="display:none">

      <button class="nav-item v2-nav-item" onclick="navigate('users')" id="nav-users" style="display:none">

        User Management
      </button>
    </nav>
    <div class="v2-sidebar-foot">
      <div class="v2-user">
        <span class="v2-user-avatar" aria-hidden="true">FG</span>
        <span class="v2-user-meta">
          <span class="v2-user-name" id="user-pill"></span>
          <span id="role-badge" class="badge badge-gray">&#x1F396; Dispatcher</span>
        </span>
      </div>
      <button class="nav-item v2-nav-item is-signout" onclick="signOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign Out
      </button>
    </div>
  </div>
  <div id="nav-backdrop" onclick="closeNav()"></div>

  <div id="main">
    <div id="topbar">
      <button id="mobile-menu-btn" onclick="toggleNav()" aria-label="Open menu">
        <span class="nav-icon" style="font-family:'Material Symbols Outlined';font-size:24px;font-weight:300;line-height:1">menu</span>
      </button>
      <h1 id="page-title">Dashboard</h1>
      <img src="img/vgn-logo-dark.png" alt="VGN Trucking" class="topbar-brand-logo"/>
      <!-- The signed-in identity moved into the sidebar's .v2-user chip, where
           the v2 shell puts it. #user-pill and #role-badge are ids that
           updateUserBar() writes into, so each can exist only once: leaving a
           copy here would have left whichever came second permanently blank.
           The theme toggle stays — it is page chrome, not identity. -->
      <div class="user-bar">
        <button id="theme-toggle" title="Toggle dark/light mode" onclick="toggleTheme()">
          <span id="theme-icon" style="font-family:'Material Symbols Outlined';font-size:20px;line-height:1;font-weight:300">light_mode</span>
        </button>
      </div>
    </div>
    <div id="content"></div>

<div id="confirm-modal" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:380px">
    <div class="modal-header" id="confirm-title">Confirm</div>
    <div class="modal-body" id="confirm-body" style="color:var(--text2);font-size:13px;line-height:1.6"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="confirmResolve(false)">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok" onclick="confirmResolve(true)">Delete</button>
    </div>
  </div>
</div>

<div id="add-vehicle-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeAddVehicleModal()">
  <div class="modal" style="max-width:480px">
    <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center">
      <span>🚛 Add to Fleet</span>
      <button class="btn btn-ghost btn-sm" onclick="closeAddVehicleModal()" style="font-size:18px;line-height:1;padding:2px 8px">×</button>
    </div>
    <div class="modal-body" id="avm-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAddVehicleModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doAddFromModal()">+ Add to Fleet</button>
    </div>
  </div>
</div>

<script>
  (function() {
    var saved = localStorage.getItem('fg_theme') || 'dark';
    if (saved === 'light') {
      document.documentElement.classList.add('light');
      document.body.classList.add('light');
    }
  })();
  function toggleTheme() {
    var isLight = document.body.classList.contains('light');
    var next = isLight ? 'dark' : 'light';
    document.body.classList.toggle('light', !isLight);
    document.documentElement.classList.toggle('light', !isLight);
    localStorage.setItem('fg_theme', next);
    var icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = next === 'light' ? 'dark_mode' : 'light_mode';
  }
  window.addEventListener('DOMContentLoaded', function() {
    var saved = localStorage.getItem('fg_theme') || 'dark';
    var icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = saved === 'light' ? 'dark_mode' : 'light_mode';
  });

  // ── Mobile nav drawer ──────────────────────────────────────
  function toggleNav() { document.body.classList.toggle('nav-open'); }
  function closeNav()  { document.body.classList.remove('nav-open'); }
  // Close the drawer after tapping any sidebar item (mobile)
  document.addEventListener('click', function(e) {
    var item = e.target.closest('#sidebar .nav-item');
    if (item) closeNav();
  });
</script>

<link rel="stylesheet" href="css/reminders.css"/>
<script src="js/app.js?v=20260818a"></script>
<script src="js/reminders.js?v=20260723b"></script>

</html>
