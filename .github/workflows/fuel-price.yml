name: Update diesel price

# Keeps the toll console's diesel price on the EIA national average.
#
# NO API KEY. api.eia.gov requires one, but EIA's public weekly page does
# not — and the CORS wall that blocks a browser does not apply here,
# because this runs server-side with curl. So there is nothing to register
# for, nothing to leak, and nothing for anyone to maintain.
#
# EIA publishes the weekly series Monday afternoon ET, so this runs daily
# at 22:40 UTC (~6:40pm ET) to pick it up the same day. The figure only
# moves once a week — that is the series, not a fault.
#
# The parser fails loudly rather than writing a wrong number: a mispriced
# load is worse than a stale one, and the previous price simply stays.

on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # node24, matching deploy.yml — the Node 20 runtime is being retired.
      - uses: actions/checkout@v7

      - name: Fetch EIA weekly diesel page
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-delay 5 \
            -A 'FleetGuard/1.0 (fleet ops; +https://fleetguards.app)' \
            -o /tmp/gasdiesel.html \
            'https://www.eia.gov/petroleum/gasdiesel/'
          echo "fetched $(wc -c < /tmp/gasdiesel.html) bytes"

      - name: Parse and write data/fuel-price.json
        run: node scripts/eia-diesel.js /tmp/gasdiesel.html 0.20

      - name: Commit if the price moved
        run: |
          set -euo pipefail
          if git diff --quiet -- data/fuel-price.json; then
            echo "Price unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-price.json
          git commit -m "Diesel price: $(node -e '
            const d=require("./data/fuel-price.json");
            process.stdout.write(`${d.national} + ${d.margin} = ${d.price} (week of ${d.period})`);
          ')"
          git push
