<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VGN Driver Leads</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://tmpdsiuadafbkmldvlki.supabase.co wss://tmpdsiuadafbkmldvlki.supabase.co; img-src 'self' data:;"/>

<style>
  :root{ --bg:#08111f; --card:#111d2d; --line:#26354a; --orange:#ff5a00; --text:#dbe3ee; --muted:#8796a9; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;}
  .wrap{max-width:1160px;margin:0 auto;padding:20px 16px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.07);padding:16px;position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em;}
  .btn{background:var(--orange);color:#08111f;border:none;border-radius:9px;padding:9px 16px;font-weight:800;cursor:pointer;font-size:14px;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .muted{color:var(--muted);}
  /* login */
  #login{max-width:360px;margin:12vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;}

  label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;}
  input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid #33455c;background:#0a1422;color:#fff;font-size:15px;}
  #login .btn{width:100%;margin-top:18px;padding:12px;}
  .err{color:#ffb4ab;font-size:14px;margin-top:12px;display:none;}
  /* dashboard cards */
  #app{display:none;}
  .chartcard,.statcard{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px;}
  .chartcard{margin-bottom:16px;}
  .cardtitle{margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .cardtitle .note{font-size:11px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:14px;}
  .stat .n{font-size:26px;font-weight:800;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.03em;}
  .c-cyan{color:#22d3ee}.c-green{color:#3ddc84}.c-amber{color:#ffb547}.c-blue{color:#6ea8fe}
  /* chart */
  .pv-chart{margin-top:20px;border-top:1px solid rgba(255,255,255,.06);padding-top:16px}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .chart-head b{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .chart-head span{font-size:11px;color:var(--muted)}
  .pv-bars{display:flex;align-items:flex-end;gap:2px;height:90px}
  .pv-bar{flex:1 1 0;min-width:2px;background:#3ecf8e;border-radius:2px 2px 0 0;opacity:.85}
  .pv-bar:hover{opacity:1}
  .pv-axis{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
  /* table */
  .count{font-weight:800;font-size:15px;margin:20px 0 10px;} .count span{color:var(--orange);}
  .tablewrap{overflow-x:auto;border:1px solid rgba(255,255,255,.07);border-radius:14px;}
  table{width:100%;border-collapse:collapse;min-width:760px;}
  th,td{text-align:left;padding:12px 14px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap;}
  th{color:#fff;font-weight:700;background:#0c1626;position:sticky;top:0;}
  td.name{font-weight:700;color:#fff;white-space:normal;}
  a.tel{color:var(--orange);text-decoration:none;font-weight:700;}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
  .pill.sent{background:rgba(61,220,132,.14);color:#3ddc84;} .pill.failed{background:rgba(255,138,74,.14);color:#ff8a4a;}
  .empty{padding:48px 16px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

  <h2>Driver Leads</h2>
  <p>Sign in to view VGN driver applications.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username"/>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password"/>
  <button class="btn" id="loginBtn">Sign In</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app">

    <h1>VGN Driver Leads</h1>

      <button class="btn ghost" id="refreshBtn">Refresh</button>
      <button class="btn ghost" id="logoutBtn">Sign out</button>
    </div>
  </header>
  <div class="wrap">
    <div id="dash"></div>
    <div class="count" id="count"></div>
    <div class="tablewrap">

  </div>
</div>

<script>

  function renderDash(sessions, events, leads, leadsTotal, sessTotal){
    var DAY=86400000, CHART_DAYS=30;

    for(var w=0;w<7;w++){ weekKeys[chiDay(new Date(now.getTime()-w*DAY))]=1; }
    var cToday=0,cWeek=0,cMonth=0, actSum=0, preSum=0, preN=0, shortN=0;
    var buckets={}; for(var i=0;i<CHART_DAYS;i++){ var dd=new Date(chartStart.getTime()+i*DAY); buckets[chiDay(dd)]={d:dd,n:0,c:0}; }

        conversion_pct:srcAgg[k].contacts>=5?((srcAgg[k].contacts/srcAgg[k].visits)*100).toFixed(1):'',

        conversion_pct_90d:visits>0?((preN/visits)*100).toFixed(1):'',avg_active_s:Math.round((actSum/Math.max(1,visits))/1000),
        avg_pre_submit_s:preN>0?Math.round((preSum/preN)/1000):'',short_visit_pct:visits>0?((shortN/visits)*100).toFixed(1):''} };

    var st=function(cls,n,l){ return '<div class="stat"><div class="n '+cls+'">'+num(n)+'</div><div class="l">'+l+'</div></div>'; };
    var bars=series.map(function(s){ var h=s.n>0?Math.max(6,Math.round(s.n/maxN*100)):2; return '<div class="pv-bar" style="height:'+h+'%" title="'+shortDay(s.d)+' — '+s.n+' visit'+(s.n===1?'':'s')+(s.c?' · '+s.c+' contact'+(s.c===1?'':'s'):'')+'"></div>'; }).join('');
    var hbars=hours.map(function(v,h){ var hh=v>0?Math.max(5,Math.round(v/maxH*100)):2; return '<div class="pv-bar" style="height:'+hh+'%" title="'+(h<10?'0'+h:h)+':00 — '+v+' visit'+(v===1?'':'s')+'"></div>'; }).join('');
    var convRate=visits>0?pctf(preN,visits):'—';

      srcRows+='<tr><td style="text-align:left">'+esc(LABELS[k]||k)+'</td><td>'+a.visits+'</td><td>'+pctf(a.visits,visits)+'</td><td>'+a.contacts+'</td><td>'+(small?'—':pctf(a.contacts,a.visits))+'</td><td>'+fmtDwell(a.act/Math.max(1,a.visits))+'</td><td>'+(small?'—':fmtDwell(a.pre/Math.max(1,a.preN)))+'</td></tr>';

        '<div class="pv-chart"><div class="chart-head"><b>Daily visits</b><span>last 30 days · peak '+maxN+'/day</span></div><div class="pv-bars">'+bars+'</div><div class="pv-axis"><span>'+shortDay(series[0].d)+'</span><span>'+shortDay(series[series.length-1].d)+'</span></div></div>'+
        '<div class="pv-chart"><div class="chart-head"><b>Busiest hours</b><span>last 30 days · Central</span></div><div class="pv-bars">'+hbars+'</div><div class="pv-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>'+
      '</div>'+
      '<div class="statgrid">'+
        '<div class="statcard"><div class="cardtitle">Conversion <span class="note">measured · 90 days</span></div><div class="stats">'+st('c-cyan',leadsTotal,'Saved contacts')+st('c-green',convRate,'Conversion rate')+st('c-amber',ratioStr,'Visits per contact')+'</div></div>'+

  function renderTable(res){

  window.__vgnCsv=function(){
    var a=window._vgnAgg; if(!a) return;
    var q=function(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v; };
    var rows=[['VGN /vgn/ aggregate analytics — NO personal data'],['Generated',a.generatedAt],['Timezone',a.tz],['Version',a.version],['Window (days)',a.windowDays],[],
      ['SUMMARY'],['metric','value'],['visits_90d',a.summary.visits_90d],['visits_total',a.summary.visits_total],['saved_contacts_total',a.summary.saved_contacts_total],['submitted_90d',a.summary.submitted_90d],['conversion_pct_90d',a.summary.conversion_pct_90d],['avg_active_seconds',a.summary.avg_active_s],['avg_pre_submit_seconds',a.summary.avg_pre_submit_s],['short_visit_pct',a.summary.short_visit_pct],[],

    rows.push([],['Definitions: Visit=session (30-min timeout, reloads merged, bots excluded). Active time=foreground estimate (hidden/idle>60s excluded), not proven attention. Saved contact=backend-confirmed callback request; clicks are intent, not completed calls/applications. Rates for cohorts under 5 contacts omitted.']);
    var csv=rows.map(function(r){return r.map(q).join(',');}).join('\r\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}), url=window.URL.createObjectURL(blob), el=document.createElement('a');
    el.href=url; el.download='vgn-analytics-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(el); el.click(); document.body.removeChild(el); setTimeout(function(){window.URL.revokeObjectURL(url);},2000);
  };

  async function loadAll(){
    document.getElementById('dash').innerHTML='<div class="muted" style="padding:20px 0">Loading…</div>';
    var DAY=86400000, winStart=new Date(Date.now()-90*DAY);
    var r=await Promise.all([
      sb.from('va_sessions').select('started_at,source,utm_campaign,posting_city,active_ms,submitted,pre_submit_active_ms,device,session_id').eq('is_bot',false).gte('started_at',winStart.toISOString()).limit(50000),
      sb.from('va_events').select('type').gte('ts',winStart.toISOString()).limit(50000),
      sb.from('driver_leads').select('created_at,full_name,phone,recruiter,program,best_time,sms_status,source,session_id').order('created_at',{ascending:false}).limit(500),
      sb.from('driver_leads').select('id',{count:'exact',head:true}),
      sb.from('va_sessions').select('session_id',{count:'exact',head:true}).eq('is_bot',false)
    ]);
    var sessRes=r[0], evRes=r[1], leadsRes=r[2], leadsCountRes=r[3], sessTotalRes=r[4];
    var leadsTotal=(leadsCountRes && !leadsCountRes.error && leadsCountRes.count!=null)?leadsCountRes.count:((leadsRes.data||[]).length);
    var sessTotal=(sessTotalRes && !sessTotalRes.error && sessTotalRes.count!=null)?sessTotalRes.count:((sessRes.data||[]).length);
    renderDash(sessRes.data||[], evRes.data||[], leadsRes.data||[], leadsTotal, sessTotal);
    renderTable(leadsRes);
  }

  async function enterApp(session){
    show('app');
    document.getElementById('who').textContent=session.user.email||'';
    await loadAll();
  }

  document.getElementById('loginBtn').addEventListener('click', async function(){
    var email=document.getElementById('email').value.trim(), pw=document.getElementById('password').value;
    var err=document.getElementById('loginErr'), btn=this;
    if(!email||!pw){ err.textContent='Enter email and password.'; err.style.display='block'; return; }
    err.style.display='none'; btn.disabled=true; btn.textContent='Signing in…';
    var res=await sb.auth.signInWithPassword({email:email,password:pw});
    btn.disabled=false; btn.textContent='Sign In';
    if(res.error){ err.textContent='Invalid email or password.'; err.style.display='block'; return; }
    await enterApp(res.data.session);
  });
  document.getElementById('password').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
  document.getElementById('logoutBtn').addEventListener('click', async function(){ await sb.auth.signOut(); show('login'); });
  document.getElementById('refreshBtn').addEventListener('click', loadAll);

  (async function init(){
    var s=await sb.auth.getSession();
    if(s.data && s.data.session){ await enterApp(s.data.session); } else { show('login'); }
  })();
})();
</script>
</body>
</html>
